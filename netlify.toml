# KidsWear web — Netlify build config.
# We point Netlify at apps/web/ as the build base, so it uses apps/web's
# package.json + vite.config and treats apps/web/dist as the publish dir.
# This bypasses the root Turborepo pipeline at build time, which is intentional:
# Netlify only needs the web app's output; the rest of the monorepo (mobile,
# Cloud Functions, shared packages) is not deployed here.

[build]
  base = "apps/web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — react-router-dom handles every other route client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# FCM service worker must NEVER be cached; it'll be served fresh on every
# load so background-message handling stays current.
[[headers]]
  for = "/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# Vite emits fingerprinted asset filenames; safe to cache aggressively.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers — MUST stay identical to firebase.json (hosting.headers, source "**").
# scripts/security-headers.test.ts fails CI when the two drift. Rationale: docs/FAZALAR.md, Faza 12.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseapp.com; frame-src 'self' https://*.firebaseapp.com https://*.web.app; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=(), browsing-topics=(), screen-wake-lock=(self), fullscreen=(self)"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
