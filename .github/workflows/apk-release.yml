# Android APK → GitHub Release, so the app can be installed from a phone:
#   https://github.com/Abdulmajidkhan007/rn-r-e-commerce/releases/latest/download/kidswear.apk
#
# The mobile app talks to Firebase through the JS SDK, configured from
# RN_PUBLIC_* variables (babel inlines apps/mobile/.env at build time). Like the
# web deploy, the config is read from the Firebase project — nothing typed by
# hand. Needs the same FIREBASE_PROJECT_ID variable and FIREBASE_SERVICE_ACCOUNT
# secret as deploy.yml.
#
# Signing: android/keystore.properties is not in the repo, so the release build
# falls back to the debug key — fine for installing on a phone, NOT for Play.
name: APK Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '.github/workflows/apk-release.yml'

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: true

jobs:
  apk:
    if: ${{ vars.FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE: npx --yes firebase-tools@15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Service account kaliti
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret berilmagan."
            exit 1
          fi
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Mobil ilova config'i (.env)
        env:
          ADMIN_EMAIL: ${{ vars.VITE_ADMIN_EMAIL }}
        run: |
          json() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("{")));if(j.status!=="success"){console.error(j.error||s);process.exit(1)}console.log(JSON.stringify(j.result))})'; }
          APP_ID=$($FIREBASE apps:list WEB --project "$PROJECT_ID" --json | json | jq -r '.[0].appId // empty')
          if [ -z "$APP_ID" ]; then
            echo "::error::Firebase loyihada Web ilova yo'q — avval Deploy (Firebase) workflow'ini ishga tushiring."
            exit 1
          fi
          $FIREBASE apps:sdkconfig WEB "$APP_ID" --project "$PROJECT_ID" --json | json > "$RUNNER_TEMP/sdk.json"
          jq -r '.sdkConfig | {
              RN_PUBLIC_FIREBASE_API_KEY: .apiKey,
              RN_PUBLIC_FIREBASE_AUTH_DOMAIN: .authDomain,
              RN_PUBLIC_FIREBASE_PROJECT_ID: .projectId,
              RN_PUBLIC_FIREBASE_STORAGE_BUCKET: (.storageBucket // ""),
              RN_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: .messagingSenderId,
              RN_PUBLIC_FIREBASE_APP_ID: .appId,
              RN_PUBLIC_FIREBASE_MEASUREMENT_ID: (.measurementId // "")
            } | to_entries[] | "\(.key)=\(.value)"' "$RUNNER_TEMP/sdk.json" > apps/mobile/.env
          echo "RN_PUBLIC_ADMIN_EMAIL=$ADMIN_EMAIL" >> apps/mobile/.env

          # Native Firebase (push) needs google-services.json for the Android
          # app. Without it messaging() throws at startup and the app closes —
          # so the Android app is found (or created) and its config downloaded.
          # The debug keystore's SHA-1 is registered so Google Sign-In accepts
          # this debug-signed APK.
          PKG=com.kidswear
          ANDROID_ID=$($FIREBASE apps:list ANDROID --project "$PROJECT_ID" --json | json | jq -r --arg p "$PKG" '[.[] | select(.packageName == $p)][0].appId // empty')
          if [ -z "$ANDROID_ID" ]; then
            ANDROID_ID=$($FIREBASE apps:create ANDROID KidsWear --package-name "$PKG" --project "$PROJECT_ID" --json | json | jq -r '.appId')
          fi
          SHA1=$(keytool -list -v -keystore apps/mobile/android/app/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:/ {print $2}')
          SHA_LIST=$($FIREBASE apps:android:sha:list "$ANDROID_ID" --project "$PROJECT_ID" | tr -d ':' | tr 'A-F' 'a-f')
          if ! grep -q "$(echo "$SHA1" | tr -d ':' | tr 'A-F' 'a-f')" <<< "$SHA_LIST"; then
            # A duplicate is rejected by the API — harmless, so not fatal.
            $FIREBASE apps:android:sha:create "$ANDROID_ID" "$SHA1" --project "$PROJECT_ID" || echo "SHA-1 qo'shilmadi (ehtimol allaqachon bor)."
          fi
          $FIREBASE apps:sdkconfig ANDROID "$ANDROID_ID" --project "$PROJECT_ID" --non-interactive --out apps/mobile/android/app/google-services.json
          jq -e --arg p "$PKG" '.client[] | select(.client_info.android_client_info.package_name == $p)' apps/mobile/android/app/google-services.json > /dev/null

          # Google Sign-In uses the project's web OAuth client (type 3). It is
          # listed once the Google provider is on in Firebase Auth.
          WEB_CLIENT=$(jq -r '[.client[].oauth_client[]? | select(.client_type == 3)][0].client_id // empty' apps/mobile/android/app/google-services.json)
          if [ -n "$WEB_CLIENT" ]; then
            echo "RN_PUBLIC_GOOGLE_WEB_CLIENT_ID=$WEB_CLIENT" >> apps/mobile/.env
          else
            echo "::warning::google-services.json da web OAuth client yo'q — ilovada Google bilan kirish o'chiq. Firebase Console → Authentication → Sign-in method → Google ni yoqing va APK'ni qayta yig'ing."
          fi
          cut -d= -f1 apps/mobile/.env

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Build release APK
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          # On failure the "What went wrong" block becomes an annotation —
          # readable from the run page and the API without downloading logs.
          set -o pipefail
          if ! ./gradlew assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            msg=$(grep -A30 'What went wrong' "$RUNNER_TEMP/gradle.log" | head -45)
            [ -n "$msg" ] || msg=$(tail -45 "$RUNNER_TEMP/gradle.log")
            msg=${msg//'%'/'%25'}; msg=${msg//$'\r'/}; msg=${msg//$'\n'/'%0A'}
            echo "::error title=Gradle build failed::$msg"
            exit 1
          fi
          # Icons render as boxes when the font is missing (APK v1.0.8).
          if ! unzip -l app/build/outputs/apk/release/app-release.apk | grep -q 'assets/fonts/MaterialCommunityIcons.ttf'; then
            echo "::error title=Icon font missing::MaterialCommunityIcons.ttf APK ichida yo'q — build.gradle dagi vectoricons.iconFontsDir ni tekshiring."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kidswear.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${GITHUB_SHA::7}"
          TAG="apk-${{ github.run_number }}"
          # A 70 MB upload occasionally fails on GitHub's side; retry, and
          # surface the error as an annotation (logs are not readable from
          # the phone).
          for attempt in 1 2 3; do
            if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --target "$GITHUB_SHA" \
                --title "KidsWear APK #${{ github.run_number }} ($SHA)" \
                --notes "Android APK, commit $SHA. Debug-key signed — for installing on a phone, not for Play Store." \
                --latest 2> "$RUNNER_TEMP/gh.err" || true
            fi
            if gh release upload "$TAG" "$RUNNER_TEMP/kidswear.apk" --clobber --repo "$GITHUB_REPOSITORY" 2>> "$RUNNER_TEMP/gh.err"; then
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          msg=$(tail -5 "$RUNNER_TEMP/gh.err" | tr '\n' ' ')
          echo "::error title=Release upload failed::$msg"
          exit 1

      - name: Kalitni o'chirish
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" apps/mobile/.env apps/mobile/android/app/google-services.json
